name: Vidjet
description: Vidjet is a shoppable video platform for e-commerce that lets merchants
  embed on-site video without impacting page speed. Merchants build video feeds,
  tag products inside videos, and display formats such as Stories, Carousel, Bubble,
  Embed, Popup, and a Sticky Play Button across thousands of product pages. It is a
  no-code product installed via a JavaScript embed, Google Tag Manager, or platform
  plugins for Shopify, WooCommerce/WordPress, Magento, Wix, Webflow, PrestaShop, and
  Salesforce Commerce Cloud, with analytics, multilingual support, and email
  collection integrations to Klaviyo and Google Sheets. Vidjet is a Seedcamp
  portfolio company. As of this profile it publishes no public developer REST API,
  SDK, OAuth surface, or webhooks — integration is via the client-side embed script.
