apis:
- aid: vidjet:app-api
  name: Vidjet App API
  description: >-
    The first-party HTTP API behind the Vidjet embed and the Vidjet platform
    plugins, served from https://app-api.vidjet.io (Express). Vidjet publishes no
    developer documentation, reference, or machine-readable contract for it, but
    publishes the base URL and several endpoints itself: the GPL-licensed
    WordPress plugin on WordPress.org calls POST /plugins/install, POST
    /plugins/uninstall, POST /orders and /woocommerce/auth-callback, and the
    public embed script at media.vidjet.io/client-app.js calls GET
    /widgets?siteId=... to resolve which video campaigns render on a page.
    Endpoint existence was verified by OPTIONS preflight (each returns 200 with an
    Allow header, while unknown paths return 404) and GET /widgets was observed
    returning 200 application/json without authentication. No OpenAPI, GraphQL
    SDL, AsyncAPI, MCP server, or agent card is published on any Vidjet host.
  humanURL: https://help.vidjet.io/en/articles/5523099-manual-integration-script-js
  baseURL: https://app-api.vidjet.io
