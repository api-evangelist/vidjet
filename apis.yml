name: Vidjet
description: Vidjet is a shoppable video platform for e-commerce that lets merchants
  embed on-site video without impacting page speed. Merchants build video feeds,
  tag products inside videos, and display formats such as Stories, Carousel, Bubble,
  Embed, Popup, and a Sticky Play Button across thousands of product pages. It is a
  no-code product installed via a JavaScript embed, Google Tag Manager, or platform
  plugins for Shopify, WooCommerce/WordPress, Magento, Wix, Webflow, PrestaShop, and
  Salesforce Commerce Cloud, with analytics, multilingual support, and email
  collection integrations to Klaviyo and Google Sheets. The company behind it is
  VIDJET TECHNOLOGIES, S.L. of Barcelona, Spain, a Seedcamp portfolio company.
  Vidjet runs no developer program and publishes no API reference, OpenAPI, SDK,
  OAuth surface, or webhook catalog. It does operate a first-party HTTP API at
  app-api.vidjet.io, whose base URL and several endpoints are published by Vidjet
  itself in the GPL-licensed WordPress plugin source and in the public embed
  script — a real but undocumented API surface, not a product an integrator can
  build against from published documentation.
